[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.8" ]

[project]
# Docs: https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
name = "mail-deduplicate"
version = "9.4.1.dev0"
description = "📧 CLI to deduplicate mails from mail boxes"
readme = "readme.md"
keywords = [
  "Babyl",
  "CLI",
  "dedup",
  "dedupe",
  "deduplicate",
  "deduplication",
  "deduplicator",
  "duplicate-detection",
  "duplicates",
  "email",
  "email-management",
  "email-tools",
  "EML",
  "mail",
  "mailbox",
  "maildir",
  "mbox",
  "MH",
  "MMDF",
  "python",
]
license = "GPL-2.0-or-later"
license-files = [ "license" ]
authors = [ { name = "Kevin Deldycke", email = "kevin@deldycke.com" } ]
# Python versions and their status: https://devguide.python.org/versions/
requires-python = ">=3.10"
classifiers = [
  # See: https://pypi.org/pypi?%3Aaction=list_classifiers
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Communications :: Email",
  "Topic :: Utilities",
  "Typing :: Typed",
]
# Semantic versioning works in theory. In practice, it is hard to guarantee.
# That's why we rely on >= specifier instead of ~= to relax constraints. This gives more freedom to packagers to
# release hotfixes for security vulnerabilities in the future.
# See also discussion about upper limits at: https://iscinumpy.dev/post/bound-version-constraints/#tldr
# All minimal version choice are documented. Reasons to bump a minimal version are:
# - bug fixes,
# - security fixes,
# - new code path we depends on,
# - aligns minimal Python requirements to ours,
# - adds new explicit support Python version.
dependencies = [
  # Provides enum.StrEnum for Python < 3.11; all versions expose the class.
  "backports-strenum>=1; python_version<'3.11'",
  # Below 9.4.1, a run started from `python -c` crashes on a RuntimeError while it
  # parses its options: test_killed_run_needs_force_unlock starts its runs that way.
  # The [toml] extra pulls tomlkit for --export-config toml.
  "click-extra[toml]>=9.4.1",
  # bug_report.py asks is_any_agent(), added in 10.0.0. Aligned to the 13.4 floor
  # of click-extra 9.4.1, the lowest release any install can resolve.
  "extra-platforms>=13.4",
  # Resolves the per-platform cache directory holding the hash cache database
  # (cache.py). 4.5.0 is the first release requiring Python 3.10, aligning its
  # minimal Python version to ours.
  "platformdirs>=4.5",
]
urls.Changelog = "https://github.com/kdeldycke/mail-deduplicate/blob/main/changelog.md"
urls.Documentation = "https://kdeldycke.github.io/mail-deduplicate"
urls.Download = "https://github.com/kdeldycke/mail-deduplicate/releases/tag/v9.4.1.dev0"
urls.Funding = "https://github.com/sponsors/kdeldycke"
urls.Homepage = "https://github.com/kdeldycke/mail-deduplicate"
urls.Issues = "https://github.com/kdeldycke/mail-deduplicate/issues"
urls.Repository = "https://github.com/kdeldycke/mail-deduplicate"
scripts.mdedup = "mail_deduplicate.__main__:main"

[dependency-groups]
## Non-runtime dependencies, for development and CI, use minimal-version floors: uv.lock pins the
## exact versions and the sync-deps updaters manage bumps within the cooldown.
## Unless the package has been referenced in sections above, in which case we align the version specifier.
test = [
  # boltons 25.0.0 dropped Python 3.9, matching our requires-python >= 3.10.
  # Test-only: conftest.py uses iterutils.same to check fixture homogeneity.
  "boltons>=25",
  # Aligned to the runtime click-extra floor.
  "click-extra[pytest]>=9.4.1",
  # coverage 7.11.0 dropped Python 3.9, matching our requires-python >= 3.10.
  "coverage[toml]>=7.11",
  # Aligned to the runtime extra-platforms floor. The [pytest] extra provides the
  # skip_windows decorator that tests/test_mail.py imports.
  "extra-platforms[pytest]>=13.4",
  # Pytest 9.0.0 introduced support for native TOML configuration files.
  "pytest>=9",
  # Below 7.0.0, pytest-cov also measures the subprocesses that
  # test_killed_run_needs_force_unlock starts, without branch data: the run then
  # ends on an INTERNALERROR that cannot combine the two kinds of data.
  "pytest-cov>=7",
  # pytest-github-actions-annotate-failures 0.2 requires Python >= 3.8; CI annotation
  # API stable since 0.1.x.
  "pytest-github-actions-annotate-failures>=0.2",
  # Below 3.3.0, each xdist worker picks its own default seed: the workers then
  # collect the tests in different orders, and the session aborts. 3.3.1 fixes
  # 3.3.0 for a run without xdist.
  "pytest-randomly>=3.3.1",
  # pytest-xdist < 3.7 fails on Python 3.14 (no requires-python guard in older releases);
  # [psutil] extra needed for --numprocesses=auto.
  "pytest-xdist[psutil]>=3.7",
  # Test-only: fixtures build RFC-2822 dates with Instant/Date/Time (conftest.py,
  # test_strategy.py). whenever's pre-1.0 API still renames methods between
  # releases, so pin to the 0.10 shape we build against.
  "whenever>=0.10",
]
docs = [
  # docs/tests.md documents the tests/ modules, which autodoc can only import with
  # the test dependencies installed.
  { include-group = "test" },
  # docs/cli_screenshots_update.py draws the readme captures with --wrap-marker, which
  # click-extra adds in 9.5.2. Tracked from its main branch until that release ships:
  # see [tool.uv.sources].
  "click-extra[sphinx]>=9.5.2.dev0",
  # furo 2024.8.6+ supports Sphinx 8; floored at a recent CalVer release.
  "furo>=2025.9.25",
  # myst-parser 5.1 ships the native "alert" extension (enabled in docs/conf.py)
  # that renders GitHub-style alerts as admonitions; earlier 5.x reject "alert".
  "myst-parser>=5.1",
  # Sphinx  8.0.0 is the first version to drop Python 3.9, like us.
  "sphinx>=8",
  # sphinx-autodoc-typehints 2.4.0 is the first version that is aligned to our Python >= 3.10 requirement.
  "sphinx-autodoc-typehints>=2.4",
  # sphinx-copybutton 0.5.2 stabilized the copy button behavior for code blocks.
  "sphinx-copybutton>=0.5.2",
  # sphinx-design 0.6 introduced the current directive syntax for cards, grids, and tabs.
  "sphinx-design>=0.6",
  # sphinx-sitemap 2.7.0 and 2.7.1 turn sitemap_show_lastmod on by default, which
  # dates every page from its git history. 2.7.2 turns it back off.
  "sphinx-sitemap>=2.7.2",
  # sphinxcontrib-mermaid 1.2.3 fixed mermaid_d3_zoom configuration support.
  "sphinxcontrib-mermaid>=1.2.3",
  # sphinxext-opengraph 0.13 stabilized OpenGraph metadata generation for Sphinx 8+.
  "sphinxext-opengraph>=0.13",
]
typing = [
  # backports-strenum provides StrEnum stubs for mypy --python-version 3.10 analysis;
  # version-gated to Python < 3.11 in the runtime deps, so added here unconditionally
  # for type checking from modern interpreters.
  "backports-strenum>=1",
  # types-boltons 25.0.0.20250822 is the first stub release covering the boltons 25.0
  # API. boltons is a test-only dependency, but mypy also checks the test suite.
  "types-boltons>=25.0.0.20250822",
]

[tool.uv]
# Floor uv at the minimum resolver relied on, with no upper bound. CI installs
# the exact uv each astral-sh/setup-uv step pins, which must satisfy this floor.
required-version = ">=0.11.15"
# The docs are only built on modern Python, letting the docs group adopt
# packages (like myst-parser 5.1) that dropped support for our older floors.
dependency-groups.docs = { requires-python = ">= 3.14" }
# click-extra is tracked from its main branch until 9.5.2 ships, paired with the
# .dev floor of the docs group: sync-dep-sources swaps it back once released.
sources.click-extra = { git = "https://github.com/kdeldycke/click-extra", branch = "main" }
# Cooldown buffer before adopting newly released packages.
exclude-newer = "1 week"
exclude-newer-package = { certifi = "2026-10-22T00:00:00Z" }
# Package is at root level, not in "./src/".
build-backend.module-root = ""
build-backend.source-exclude = [
  "**/.DS_Store",
  "**/__pycache__",
]
# Ship the test suite in the sdist, so distribution packagers can build and test
# straight from the PyPI sdist instead of fetching a GitHub tag tarball. The tests
# read no repository file besides pyproject.toml, which every sdist carries, except
# the one that checks docs/tests.md and skips without it.
# source-include feeds the sdist only: the wheel stays module-only.
build-backend.source-include = [ "tests/**" ]

[tool.nuitka]
product-name = "Mail Deduplicate"
file-description = "📧 CLI to deduplicate mails from mail boxes"
copyright = "Kevin Deldycke <kevin@deldycke.com> and contributors. Distributed under GPL-2.0-or-later license."
file-version = "9.4.1"
product-version = "9.4.1"
# click-extra ships themes.toml as package data loaded via importlib.resources;
# Nuitka does not auto-bundle non-Python data files, so the binary falls back
# to the no-color theme at startup unless it is declared here.
include-package-data = [ "click_extra" ]
# Each platform points at its native icon format. Passing a non-native image
# (like a PNG to --windows-icon-from-ico) makes Nuitka require the imageio
# package to convert it, which fails the build.
macos-app-icon = "docs/assets/icon.icns"
linux-icon = "docs/assets/icon.png"
windows-icon-from-ico = "docs/assets/icon.ico"

[tool.typos]
# Correct capitalization for proper nouns, plus "PATCHed"
# and "PNGs": typos cuts an all-caps run before its trailing lowercase letters,
# so "PNGs" is checked as "PN" + "Gs" and rewritten to "ONGs", and "PATCHed" as
# "PATC" + "Hed" and rewritten to "PATCHead". Only an identifier accept
# suppresses either, since the checker never sees the whole word. Any acronym
# carrying a lowercase suffix needs its own entry here.
default.extend-identifiers = { Github = "GitHub", IOS = "iOS", Javascript = "JavaScript", MacOS = "macOS", PATCHed = "PATCHed", PNGs = "PNGs", PyPi = "PyPI", Typescript = "TypeScript" }
# False positives: "astroid" is a Python AST library (not "asteroid"); "certifi" is the CA bundle package a dependency graph lists under requests (not "certify"); "oject" appears when "pyproject.toml" is split across line breaks in CLI help output; "sur" is macOS 11 Big Sur and Homebrew's big_sur bottle tag (not "sure").
default.extend-words = { astroid = "astroid", certifi = "certifi", oject = "oject", sur = "sur" }
# Skip content between <!-- typos:off --> and <!-- typos:on --> markers.
default.extend-ignore-re = [ "(?s)<!-- typos:off -->.*?<!-- typos:on -->" ]
# Check hidden files and directories too, which typos skips by default: the
# `.github/` workflows and the `.claude/` agents and skills live there.
files.ignore-hidden = false
# Hidden files bring in paths typos must never rewrite. `.git` holds the
# repository internals. `sync-gitignore` regenerates `.gitignore`, which also
# carries globs like `[Ii]nclude` that typos reads as a typo it cannot fix.
# `.mailmap` lists contributor names, where a fix renames a person.
files.extend-exclude = [ ".git", ".gitignore", ".mailmap" ]
# Skip the content of SVG files. A terminal capture renders each run of
# same-styled characters as one <text> element, so a word cut at a run boundary
# leaves a fragment the checker reads as a misspelling. Correcting it in place
# adds a letter to a run of fixed width, while the next run still carries the
# rest of the word, so the picture gains a doubled letter. typos ships an "svg"
# file type, so no glob is needed here. Filenames stay checked.
type.svg.check-file = false

[tool.mypy]
# Type-check the bodies of unannotated functions too (matches upstream repomatic).
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
pretty = true
warn_unused_configs = true
overrides = [
  # mypy checks at the Python 3.10 floor, and docs/conf.py imports Sphinx for
  # its type hints. Sphinx 9.1 uses the `type` statement of Python 3.12, which
  # stops the whole run on a syntax error. Skipping the import types every
  # Sphinx name as `Any`.
  { module = [ "sphinx.*" ], ignore_missing_imports = true, follow_imports = "skip" },
]

[tool.pytest]
# https://docs.pytest.org/en/latest/customize.html#pyproject-toml
addopts = [
  "--durations=10",
  # Coverage sources, the branch flag and the failure ratchet all live in
  # [tool.coverage].
  "--cov",
  "--cov-report=term",
  # Run tests in parallel across all logical cores (pytest-xdist).
  "--numprocesses=auto",
  # Import test modules via importlib instead of prepending their root dir to
  # sys.path. Avoids "import file mismatch" collection errors when an installed
  # copy of the package coexists with the source tree, as in distro builds.
  "--import-mode=importlib",
]
markers = [
  "once: Tests that only need to run once, not across the full CI matrix.",
]
# Restrict collection to the test suite, so pytest never descends into the
# package or an installed copy of it in dual-copy builds.
testpaths = [ "tests" ]
# Make sure tests that are expected to fail do not resurrect and start working all of a sudden.
xfail_strict = true

# https://coverage.readthedocs.io/en/latest/config.html
[tool.coverage]
run.source = [ "mail_deduplicate" ]
run.branch = true
# Coverage ratchet: the suite fails below this. The matrix slice (everything
# but the `once` marker) measures 98.67% on macOS with Python 3.14, and the
# package holds only a handful of platform-conditional lines, so the OS and
# Python spread across cells is noise. About two points of margin absorb it
# without waving a real regression through.
#
# The `once-tests` workflow job overrides this to 0, covering a fraction of the
# package on its own by design. A focused local run trips it too, so pair those
# with `--no-cov`.
report.fail_under = 96.5
report.precision = 2

[tool.bumpversion]
current_version = "9.4.1.dev0"
# Parse versions with an optional .devN suffix (PEP 440).
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(\\.dev(?P<dev>\\d+))?"
serialize = [
  "{major}.{minor}.{patch}.dev{dev}",
  "{major}.{minor}.{patch}",
]
ignore_missing_files = true
allow_dirty = true
parts.dev.optional_value = "release"
# When dev is "release" (its optional value), the .devN suffix is omitted.
# Bumping patch/minor/major resets dev to "0", producing X.Y.Z.dev0.
# Bumping dev goes from "0" to "release", stripping the suffix for release.
parts.dev.values = [ "0", "release" ]

[[tool.bumpversion.files]]
# Update Python package version in any __init__.py file.
glob = "./**/__init__.py"
ignore_missing_version = true

[[tool.bumpversion.files]]
# Update version in [project] section. Anchored to a line start (regex) so it
# does not also match version-suffixed keys like file-version/product-version
# under [tool.nuitka], which contain `version = "X"` as a substring (their
# values collide with the package version on release commits, where the .devN
# suffix is absent).
filename = "./pyproject.toml"
regex = true
search = '(?m)^version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
# Update version in download URL.
filename = "./pyproject.toml"
search = "releases/tag/v{current_version}"
replace = "releases/tag/v{new_version}"

[[tool.bumpversion.files]]
# Keep the numeric file-version/product-version under [tool.nuitka] in sync,
# when present. Nuitka rejects PEP 440 .devN suffixes, so the file-specific
# serialize strips them; the `-version = "` prefix matches both keys at once.
# ignore_missing_version makes this a no-op in projects without [tool.nuitka].
filename = "./pyproject.toml"
ignore_missing_version = true
serialize = [ "{major}.{minor}.{patch}" ]
search = '-version = "{current_version}"'
replace = '-version = "{new_version}"'

[[tool.bumpversion.files]]
# Update the version in Markdown changelog.
filename = "./changelog.md"
search = "## [`{current_version}` (unreleased)]("
replace = "## [`{new_version}` (unreleased)]("

[[tool.bumpversion.files]]
# Update the version in the citation file. Anchored to a line start (regex) so
# it does not also match the `cff-version:` schema field, which would otherwise
# be overwritten with the package version on every bump as soon as the two
# values coincide once.
filename = "./citation.cff"
regex = true
search = "(?m)^version: {current_version}"
replace = "version: {new_version}"

[[tool.bumpversion.files]]
# Update the release date in the citation file.
filename = "./citation.cff"
regex = true
search = "date-released: \\d{{4}}-\\d{{2}}-\\d{{2}}"
replace = "date-released: {utcnow:%Y-%m-%d}"

[tool.lychee]
exclude = [
  # GitHub issue comment fragments are dynamically loaded and can't be verified.
  "^https://github.com/.+/issues/[0-9]+#issuecomment-.*$",
  # Release binary download URLs redirect to the GitHub CDN (objects.githubusercontent.com).
  "^https://github.com/.+/releases/.+/download/.*$",
  # Allow redirects of generic DOI URLs to their specific Zenodo release page.
  "^https://doi.org/.+/zenodo.*$",
  # Skip archive.ph and Sci-Hub because they restrict access to crawlers.
  # Skip HN because of rate-limiting.
  # See: https://github.com/lycheeverse/lychee/issues/989#issuecomment-1587208730
  # https://github.com/lycheeverse/lychee/pull/1147
  "archive\\.ph",
  "sci-hub\\.st",
  "ycombinator\\.com",
  # Anchored, unlike its neighbours: these patterns are substring matches, and a
  # bare `x\.com` also swallows every domain ending in it, like cloudlinux.com,
  # which is then silently never checked.
  "^https://(www\\.)?x\\.com(/.*)?$",
  # VirusTotal analysis pages are a JS app that rate-limits bots, and the
  # binaries page links one per released binary.
  "^https://www\\.virustotal\\.com/gui/.*$",
  # Bitdefender returns 403 to bots. The `av-false-positive` skill links its
  # submission portal from any repository shipping compiled binaries.
  "bitdefender\\.com",
  # Medium returns 403 to anonymous crawlers but serves the full article to a
  # browser, so a link to it stays unarchived for readers. Anchored, like
  # `x\.com` above: a bare `medium\.com` also swallows every Wayback snapshot
  # of a Medium article, which then stops being checked.
  "^https://(www\\.)?medium\\.com(/.*)?$",
  # npmjs.com returns 403 to bots.
  "^https://www\\.npmjs\\.com/package/.*$",
  # star-history.com builds its chart and its anchor with JavaScript, so both
  # the link and its fragment are invisible to lychee. The `benchmark-update`
  # skill now draws its chart locally, but a `docs/benchmark.md` it wrote
  # earlier may still embed one of these.
  "^https://star-history\\.com/.*$",
  # githubstatus.com returns 405 to HEAD requests from bots.
  "githubstatus\\.com",
  # claude.ai sits behind Cloudflare and answers 403 to crawlers.
  "^https://claude\\.ai/.*$",
  # Allow redirects to the official pip documentation.
  "^https://pip.pypa.io/.*$",
]

[tool.mdformat]
number = true
# Disable URL validation so mdformat-recover-urls can decode percent-encoded
# non-ASCII characters in link destinations back to their original form.
# See https://github.com/hukkin/mdformat/issues/312 and
# https://github.com/holy-two/mdformat-recover-urls.
validate = false

[tool.repomatic]
# 7.2.1 and 7.2.2 were tagged and released on GitHub, but never uploaded to
# PyPI. Declaring them here stops lint-changelog reporting the gap on every run.
abandoned-versions = [ "7.2.1", "7.2.2" ]
# The `lychee` component only syncs to awesome-* repositories by default.
# Opting in keeps `[tool.lychee]` in step with the bundled template. The sync
# keeps the local entries and their comments, placed after the template's.
include = [ "lychee" ]
# Render the Click command tree as roff `.1` files and attach a
# `mail-deduplicate-manpages.tar.gz` asset to every GitHub release. The script
# target mirrors `click_extra_manpages` in `docs/conf.py`, so the release
# tarball and the HTML docs site stay in lockstep.
manpages.script = "mail_deduplicate.cli:mdedup"
# One cell resolves every direct dependency to the lowest version its specifier
# allows, on the floor Python of the fastest runner. The lockfile holds the
# newest release of each, so no other cell runs a declared floor.
test-matrix.full-include = [
  { os = "ubuntu-26.04-arm", python-version = "3.10", resolution = "lowest-direct" },
]
