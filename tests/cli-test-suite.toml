# This test suite checks some high-level behavior of the mdedup CLI.

# Check mdedup is reporting the correct version of itself.
# --color=always forces ANSI in the piped subprocess output. click-extra renders
# the program name bold bright-white and the version green. The version is matched
# as \S+ so dev builds (9.0.0.dev0+<sha>) pass alongside plain releases.
[[cases]]
cli_parameters = "--version --color=always"
exit_code = 0
stdout_contains = "\u001b[97m\u001b[1mmdedup\u001b[0m, version \u001b[32m"
stdout_regex_fullmatch = "\u001b\\[97m\u001b\\[1mmdedup\u001b\\[0m, version \u001b\\[32m\\S+\u001b\\[0m\n"

# Check mdedup is reporting its usage in help screen.
[[cases]]
cli_parameters = "--help"
exit_code = 0
strip_ansi = true
stdout_contains = [
    "Usage: mdedup [OPTIONS] MAIL_SOURCE_1 MAIL_SOURCE_2",

    # Check that Enums are properly rendered in help.
    "  -b, --hash-body [skip|raw|normalized]",
    "  [default: skip]",
    "  -e, --export-format [maildir|mbox|mh|babyl|mmdf|eml]",
    "  [default: mbox]",

    # Numeric ranges are properly rendered in help. The second needle below also
    # depends on the length of the --size-threshold help string in cli.py:
    # click-extra flows the default record as ordinary words, so a help text of
    # the wrong length wraps "[default:" onto one line and "512; x>=-1]" onto the
    # next. The needle then stops matching, and the failure points here rather
    # than at the help string that caused it. Re-run this suite
    # (tests/test_cli.py::test_cli_test_suite) after editing that help string.
    "  -S, --size-threshold BYTES",
    "  [default: 512; x>=-1]",

    # -h short option is reserved for --hash-header, not --help.
    "  -h, --hash-header Header-ID",
    "  --help",

    # Individual strategies are documented at the end.
    "[select-all-but-one|discard-one]",
]

# Hash a real box across worker processes.
#
# This is the only place the parallel hashing path runs against a *frozen* binary.
# Worker processes are started by re-launching the executable, which in a compiled
# binary lands in our own entry point rather than in multiprocessing's bootstrap: a
# worker would then re-run the whole CLI instead of hashing its chunk. A
# `freeze_support()` call in `__main__.py` is what prevents that, and nothing else
# exercises it, since every other case here runs the interpreter.
#
# --hash-only stops after the hashing step, so this touches nothing on disk and
# cannot damage the fixture whatever the options say. The relative path resolves
# because both self-test runners execute from the repository checkout.
[[cases]]
cli_parameters = "--jobs=2 --hash-only tests/fixtures/eml-box"
exit_code = 0
strip_ansi = true
# Reached the end of the hashing step, having hashed every fixture mail. A worker
# re-running the CLI instead of its chunk fails this, whether it hangs, crashes or
# floods the output.
stdout_contains = "Hash: "
# Took one of the two intended routes. Sandboxed and containerised environments can
# legitimately refuse to spawn processes, and falling back is a correct outcome
# there, so both are accepted: what must not happen is neither.
stderr_regex_matches = "Hash mails across 2 processes\\.|Hash in this process instead\\."
