---
name: 🔬 Tests
"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - mail_deduplicate/**
      - tests/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/tests.yaml
  pull_request:
    branches-ignore:
      # This filter matches the PR's *base* branch (always `main`), not its
      # head, so it does not actually exclude these PRs — see
      # https://github.com/actions/runner/issues/1591. The real skip is the
      # `github.head_ref` check in the `metadata` job's `if:` below. Kept
      # here as documentation of intent.
      - major-version-increment
      - minor-version-increment
      - prepare-release
    paths:
      - mail_deduplicate/**
      - tests/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/tests.yaml
  schedule:
    # Run tests monthly to catch regressions from dependency or environment changes.
    - cron: "17 9 1 * *"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.event.head_commit.message, '[changelog] Release') }}

jobs:

  metadata:
    name: 🧬 Project metadata
    # Real version-bump skip: the trigger's `branches-ignore` matches the PR's
    # base branch (always `main`), not its head, so version-bump PRs slip
    # through it. Skipping `metadata` propagates to every `needs: metadata` job
    # below. The branch and commit-prefix lists mirror repomatic's
    # `VERSION_BUMP_BRANCHES` and `MANUAL_VERSION_BUMP_COMMIT_PREFIXES`. The
    # `[changelog] Post-release bump ` prefix is intentionally excluded: that
    # push also carries the release commit, our only post-merge test of the
    # release-frozen tree.
    if: >
      !contains(fromJSON('["major-version-increment","minor-version-increment","prepare-release"]'),
      github.head_ref)
      && !startsWith(github.event.head_commit.message || '', 'Bump major version to ')
      && !startsWith(github.event.head_commit.message || '', 'Bump minor version to ')
    runs-on: ubuntu-slim
    outputs:
      metadata: ${{ steps.metadata.outputs.metadata }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Run repomatic metadata
        id: metadata
        run: >
          uvx --no-progress 'repomatic==7.3.0' metadata
          --format github-json --output "$GITHUB_OUTPUT"
          coverage_cells test_matrix test_matrix_pr

  tests:
    needs:
      - metadata
    strategy:
      # We delegate the failure decision to each job, by the way of the "continue-on-error" flag.
      fail-fast: false
      # Matrix is pre-computed by repomatic metadata. PRs get a reduced matrix
      # (fewer OS variants and Python versions) to save CI minutes.
      matrix: >-
        ${{ github.event_name != 'pull_request'
        && fromJSON(needs.metadata.outputs.metadata).test_matrix
        || fromJSON(needs.metadata.outputs.metadata).test_matrix_pr }}
    name: "${{ matrix.state == 'stable' && '✅' || '⁉️' }} ${{ matrix.os }} / py${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    # We keep going when a job flagged as not stable fails.
    continue-on-error: ${{ matrix.state == 'unstable' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Force native ARM64 Python on Windows ARM64
        # Workaround for https://github.com/astral-sh/uv/issues/12906: uv defaults to x86_64 Python on ARM64 Windows,
        # relying on transparent emulation. Native extensions with Rust (e.g., test-results-parser from codecov-cli)
        # fail to compile because the ARM64 Rust toolchain lacks the x86_64-pc-windows-msvc target. Setting UV_PYTHON
        # to an architecture-qualified specifier forces uv (and uvx) to use native ARM64 Python for all steps.
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: echo "UV_PYTHON=cpython-${PYTHON_VERSION}-aarch64" >> "$GITHUB_ENV"
      - name: Install Python ${{ matrix.python-version }}
        # If UV cannot find the requested Python version, it exits with code 2, which let the job pass unnoticed on
        # Windows. So we force the shell to bash, even on Windows, and "set -e" to ensure any error in the install
        # process is caught and fails the job. It works because Windows runners too Git Bash available).
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          set -e
          uv --no-progress venv --python "${UV_PYTHON:-${PYTHON_VERSION}}"
      - name: Force UTF-8 encoding on Windows
        # Workaround for https://github.com/pallets/click/issues/2121: Windows GitHub Actions runners
        # redirect command output to files, which sets the encoding to the system default (cp1252).
        # Python CLI frameworks like Click then raise UnicodeEncodeError on non-ASCII output.
        if: runner.os == 'Windows'
        shell: bash
        run: echo "PYTHONIOENCODING=utf8" >> "$GITHUB_ENV"
      - name: Install project
        run: |
          uv --no-progress sync --frozen --all-extras --group test

      - name: Run local CLI
        run: |
          uv run -- mdedup --version
      - name: Run CLI from module
        run: |
          uv run        -m mail_deduplicate --version
          uv run python -m mail_deduplicate --version
      - name: Run stable CLI
        # mail-deduplicate 8.1.2 (the current stable release on PyPI) requires
        # click-extra>=7.3.0 with no upper bound. In practice the 8.1.2 code only
        # works with click-extra<7.15 (7.15+ renamed default_theme, 8.0+ removed
        # ExtraCommand). Pin click-extra<7.15 for the uvx and script-entrypoint
        # variants that exercise the PyPI package's own code. The -m module
        # variants run the local project's code (editable-installed, higher
        # priority in sys.path), so they use the project's own click-extra range.
        run: |
          uvx    --from mail-deduplicate --with 'click-extra<7.15'                   -- mdedup --version
          uv run --with mail-deduplicate --with 'click-extra<7.15'                   -- mdedup --version
          uv run --with mail-deduplicate                                              -m mail_deduplicate --version
          uv run --with mail-deduplicate                                        python -m mail_deduplicate --version
      - name: Run dev CLI
        run: |
          uvx    --from git+https://github.com/kdeldycke/mail-deduplicate -- mdedup --version
          uv run --with git+https://github.com/kdeldycke/mail-deduplicate -- mdedup --version
          uv run --with git+https://github.com/kdeldycke/mail-deduplicate -m mail_deduplicate --version
          uv run --with git+https://github.com/kdeldycke/mail-deduplicate python -m mail_deduplicate --version

      - name: Unittests
        # Coverage and JUnit XML artifacts for Codecov are configured in [tool.pytest] addopts.
        run: uv --no-progress run --frozen -- pytest

      - name: Upload coverage to Codecov
        # Upload coverage only from the coverage-distinct cells (the
        # `coverage_cells` set from repomatic metadata): coverage depends on OS
        # family and Python version, never CPU architecture, so architecture
        # twins and prerelease cells run the suite but produce coverage already
        # captured by these. The membership test pads both operands with spaces
        # to match a whole `os|python-version` token, not a substring.
        # Skip on sync-repomatic PRs (data-only changes with no coverable lines)
        # and fork PRs (secrets are not available).
        # continue-on-error: codecov-cli depends on test-results-parser, a Rust
        # extension with no wheel for win-arm64 or free-threaded Python. A build
        # failure there must not fail the overall test job.
        if: >
          github.head_ref != 'sync-repomatic'
          && env.CODECOV_TOKEN != ''
          && contains(format(' {0} ', fromJSON(needs.metadata.outputs.metadata).coverage_cells),
          format(' {0}|{1} ', matrix.os, matrix.python-version))
        continue-on-error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        shell: bash
        run: >
          uvx --no-progress 'codecov-cli==11.3.1'
          --auto-load-params-from githubactions
          upload-process
          --git-service github
          --report-type coverage
          --token "${CODECOV_TOKEN}"
      - name: Upload test results to Codecov
        if: >
          github.head_ref != 'sync-repomatic'
          && env.CODECOV_TOKEN != ''
        continue-on-error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        shell: bash
        run: >
          uvx --no-progress 'codecov-cli==11.3.1'
          --auto-load-params-from githubactions
          upload-process
          --git-service github
          --report-type test_results
          --token "${CODECOV_TOKEN}"
