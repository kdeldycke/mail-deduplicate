# The bug report mdedup prints links to this form by its file name, with the title filled in: see
# mail_deduplicate/bug_report.py.
# The development-version command below carries no `--exclude-newer` cooldown: the development floor can name a
# click-extra release younger than the window, and the flag then makes the command fail to resolve.
name: Bug report
description: Report a bug in mail-deduplicate
labels: ["🐛 bug"]
body:
  - type: markdown
    attributes:
      value: >
        Thanks for reporting a bug! Before filing, please check if the bug is
        already fixed in the latest development version. Run your command again,
        with this in place of `mdedup`:


        ```shell-session

        $ uvx --from git+https://github.com/kdeldycke/mail-deduplicate -- mdedup

        ```


        If the bug is gone, it will be included in the next release.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Bug report
      description: >
        If `mdedup` printed a bug report, paste the lines between its two `8<`
        markers. They give the version, the options of the run and the structure
        of the failing mails, with none of their content. `mdedup` also saves each
        report in the `reports` folder of its cache directory:
        `~/Library/Caches/mdedup/reports/` on macOS, `~/.cache/mdedup/reports/` on
        Linux, and `%LOCALAPPDATA%\mdedup\Cache\reports\` on Windows.
      render: text
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: >
        You can leave it empty if you pasted a bug report: it gives the options of
        the run and the structure of the failing mails. Else, give the full
        `mdedup` invocation you used, and the data set leading to the bug. Try to
        reduce it to the minimal subset of mails that triggers the problem (the
        `--hash-only` parameter helps isolate a duplicate set). Attached mails are
        public, so attach only the ones you can share: they let maintainers add
        the edge case to the test suite.
      placeholder: $ mdedup ./my_maildir/
  - type: input
    id: version
    attributes:
      label: Version
      description: >
        Output of `mdedup --version`. You can leave it empty if you pasted a bug
        report: its first line gives the version.
      placeholder: "mdedup, version X.Y.Z"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        You can leave it empty if you pasted a bug report. Else, paste the
        relevant output of the run with `--verbosity DEBUG`. DEBUG logs print file
        paths and header values, like addresses and subjects: remove them before
        you post.
      render: text
