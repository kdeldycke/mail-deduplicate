<!DOCTYPE html>
<!--
  Served for any path of the site that does not exist. Copied verbatim into the
  build by `html_extra_path` in `conf.py`: GitHub Pages answers an unmatched route
  with the `404.html` at the root of the site.

  Self-contained: no theme, no stylesheet, no script. A 404 page can show at any
  depth, so a relative asset path would break on most of them. The links start
  from the host root, because the site is published under `/mail-deduplicate/`.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found - Mail Deduplicate</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.6;
    color: #27272a;
    background: #ffffff;
  }
  main { max-width: 32rem; padding: 2rem; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
  p { margin: 0 0 1.5rem; }
  a { color: #27272a; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: inline-block; margin: 0 0.75rem; }
  @media (prefers-color-scheme: dark) {
    body { color: #d4d4d8; background: #18181b; }
    a { color: #d4d4d8; }
  }
</style>
</head>
<body>
<main>
  <h1>This page does not exist</h1>
  <p>
    The link you followed is mistyped, or the page moved. Use one of these links
    to continue.
  </p>
  <ul>
    <li><a href="/mail-deduplicate/">Home</a></li>
    <li><a href="/mail-deduplicate/install.html">Installation</a></li>
    <li><a href="/mail-deduplicate/search.html">Search</a></li>
  </ul>
</main>
</body>
</html>
